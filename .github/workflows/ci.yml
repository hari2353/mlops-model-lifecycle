name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint (ruff)
        run: ruff check src tests scripts
      - name: Type check (mypy)
        run: mypy src/mlops_lifecycle
      - name: Run tests with coverage
        run: pytest --cov=mlops_lifecycle --cov-report=term-missing
      - name: Full lifecycle run (train -> promote -> monitor)
        run: |
          python scripts/run_lifecycle.py --out artifacts \
            | tee artifacts/lifecycle.log
          python -c "
          from pathlib import Path
          log = Path('artifacts/lifecycle.log').read_text()
          assert 'promoted to PRODUCTION' in log, 'promotion missing'
          assert 'DRIFT' in log or 'drift' in log, 'monitoring output missing'
          print('lifecycle check passed')
          "
